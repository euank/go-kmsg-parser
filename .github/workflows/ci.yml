name: build-and-test
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25'
    - name: test
      run: go test -v ./...
    - name: build cmd
      run: make
    - name: lint
      uses: golangci/golangci-lint-action@v8
      with:
        version: v2.4.0
